<div class="produto-form">
    <h3>📝 Cadastrar Novo Produto</h3>
    
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0">Formulário de Cadastro</h5>
      </div>
      
      <div class="card-body">
        <form (ngSubmit)="cadastrarProduto()" #form="ngForm">
          
          <!-- ID -->
          <div class="form-group">
            <label for="id" class="form-label">ID *</label>
            <input type="number" id="id" 
                   [(ngModel)]="Produto().id" name="id"
                   class="form-control" required min="1">
          </div>
  
          <!-- Nome -->
          <div class="form-group">
            <label for="nome" class="form-label">Nome Completo *</label>
            <input type="text" id="nome" 
                   [(ngModel)]="Produto().nome" name="nome"
                   class="form-control" required>
          </div>
  
          <!-- Preço -->
          <div class="form-group">
            <label for="nome" class="form-label">Preço</label>
            <input type="text" id="preco" 
                   [(ngModel)]="Produto().preco" name="nome"
                   class="form-control" required>
          </div>
  
          <!-- Categoria -->
          <div class="form-group">
            <label for="nome" class="form-label">Categoria</label>
            <input type="text" id="categoria" 
                   [(ngModel)]="Produto().categoria" name="nome"
                   class="form-control" required>
          </div>
  
          <!-- Botões -->
          <div class="form-group mt-4">
            <button type="submit" class="btn btn-success btn-lg me-2"
                    [disabled]="!form.valid">
              ✅ Cadastrar Produto
            </button>
          </div>
  
        </form>
      </div>
    </div>
  </div>
