<div class="container-fluid min-vh-100 bg-light">
  <!-- Header -->
  <header class="bg-primary text-white shadow">
    <div class="container py-4">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="display-5 fw-bold">🎓 Sistema de Gestão de Produtos</h1>
        </div>
        <div class="col-md-4 text-end">
          <span class="badge bg-light text-primary fs-6">
            👥 {{ produtos().length }} produtos cadastrados
          </span>
        </div>
      </div>
    </div>
  </header>


  <main class="container py-4">
    <div class="row">
      

      <aside class="col-lg-4 mb-4">
        <app-produto-form 
          [Produto]="produto()" 
          (onSubmit)="adicionarProduto()">
        </app-produto-form>
      </aside>


      <section class="col-lg-8">
        <app-produto-list [produtos]="produtos()"></app-produto-list>
      </section> 

    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">Sistema desenvolvido com Angular • Turma de Programação Web</p>
    </div>
  </footer>
</div>
