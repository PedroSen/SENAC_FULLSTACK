<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de número</title>
    <script src="script.js"></script>
</head>
<body>
    <script>
        n = parseFloat(prompt("Insira um número de 0 a 10:"));
        while (n > 10 || n < 0){
            n = parseFloat(prompt("NÚMERO INVÁLIDO! Insira um número de 0 a 10:"));
        }
    </script>
</body>
</html>
