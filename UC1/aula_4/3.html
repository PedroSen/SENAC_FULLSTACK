<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
</head>
<body>
    <h1>Situação do Aluno</h1>
    <form action="">
        Nota 1:
        <input type="number" id="nota1"> <br><br>
        Nota 2:
        <input type="number" id="nota2"> <br><br>
        Nota 3:
        <input type="number" id="nota3"> <br><br>
        Nota 4:
        <input type="number" id="nota4"> <br><br>
        <br>
        <button type="button" onclick="media()">Calcular Média</button>
    </form>
    <br><br>
    <strong id="mediaAluno"></strong><br>
    <strong id="situacaoAluno"></strong>

    <script>
        function media(){
            let n1 = parseFloat(document.getElementById("nota1").value);
            let n2 = parseFloat(document.getElementById("nota2").value);
            let n3 = parseFloat(document.getElementById("nota3").value);
            let n4 = parseFloat(document.getElementById("nota4").value);

            let media = (n1 + n2 + n3 + n4)/4;

            let situacao = ""
            if(media >= 7){
                situacao = "Aprovado";
            } if(media >= 5 && media < 7){
                situacao = "Recuperação";
            } else {
                situacao = "Reprovado";
            }

            document.getElementById("mediaAluno").innerHTML = "Média: " + media.toFixed(2);
            document.getElementById("situacaoAluno").innerHTML = "Situação: " + situacao;
        }
    </script>
</body>
</html>
