<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicional</title>
</head>
<body>
    <script>
        let num1 = 10;
        let num2 = 20;
        if (num1 != num2){
            alert(num1 + " é diferente de " + num2);
        }
        if (num1 > num2){
            alert(num1 + " é maior que " + num2);
        }
        if (num1 < num2){
            alert(num1 + " é menor que " + num2);
        }
    </script>
</body>
</html>
