<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <input type="text" id="cod">
    <button onclick="inject()">Enter</button>
    </form>
    <div id="resp"></div>

    <script>
        function inject(){
            cod = document.getElementById("cod").value;
            document.getElementById("resp").innerHTML = cod;
        }
    </script>
</body>
</html>
