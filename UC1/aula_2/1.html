<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações</title>
</head>
<body>
        <!-- 4. Construir uma página na qual o usuário digitará 2 números e o programa exibirá, na tela, o resultado das quatro operações 
básicas da matemática. -->
    <script>
        let x = parseInt(prompt("Digite o primeiro valor: "));
        let y = parseInt(prompt("Digite o segundo valor: "));

        let soma = x + y;
        let sub = x - y;
        let div = x/y;
        let multi = x*y;

        let resultado = 
        "Soma: " + soma + 
        "\nSubtração: " + sub + 
        "\nDivisão: " + div + 
        "\nMultiplicação: " + multi;

        alert(resultado);

    </script>

</body>
</html>
