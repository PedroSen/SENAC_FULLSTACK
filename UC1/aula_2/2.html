<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade em 2030</title>
</head>
<body>
    <!-- 5. Construir uma página na qual o usuário digitará o ano que nasceu e o programa irá escrever, na tela, quantos anos ele 
completará em 2030. -->
    <script>
        let nascimento = parseInt(prompt("Digite seu ano de nascimento: "));

        let idade2030 = 2030 - nascimento;

        document.writeln("Em 2030, sua idade será " + idade2030);

    </script>

</body>
</html>
